name: poke
on:
  schedule:
    - cron: '30 1 * * *'    # UTC 1:30 = 北京 09:30
    - cron: '30 13 * * *'   # UTC 13:30 = 北京 21:30
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 看天说话
        run: |
          W=$(curl -sL "https://wttr.in/Jinhua?format=%t&m")
          P=$(curl -s "https://api.open-meteo.com/v1/forecast?latitude=29.08&longitude=119.65&current=precipitation&timezone=Asia%2FShanghai" | jq -r '.current.precipitation')
          H=$(TZ=Asia/Shanghai date +%H)
          echo "现在北京时间 $H 点，温度 $W，降水量 $P 毫米"

          if [ "$H" -lt 11 ]; then
            M="早，金华现在 ${W}，先吃口热的再出门"
          elif [ "$H" -lt 18 ]; then
            M="下午了，外面 ${W}，别一整天窝着不动"
          else
            M="晚上 ${W}，收工，别又熬到两点"
          fi

          if awk "BEGIN{exit !($P > 0.1)}"; then
            M="${M}｜外面在下雨，带伞"
          fi

          curl -s -X POST "https://api.day.app/${{ secrets.BARK_KEY }}/" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t '江野' --arg b "$M" '{title:$t,body:$b}')"
